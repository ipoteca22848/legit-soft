name: Windows release
on:
  workflow_dispatch:
  push:
    tags: ['aurora-v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: aurora-launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: aurora-launcher/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: aurora-launcher/src-tauri -> target
          cache-on-failure: true
      - run: npm ci
      - run: npm run build
      - run: cargo test --locked --release --features tauri/custom-protocol --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build
      - name: Smoke test Windows executable
        shell: pwsh
        run: |
          $webview = Get-ChildItem "${env:ProgramFiles(x86)}/Microsoft/EdgeWebView/Application/*/msedgewebview2.exe" -ErrorAction SilentlyContinue
          if (!$webview) {
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile "$env:RUNNER_TEMP/webview-setup.exe"
            $setup = Start-Process "$env:RUNNER_TEMP/webview-setup.exe" -ArgumentList '/silent /install' -Wait -PassThru
            if ($setup.ExitCode -notin @(0,3010)) { throw "WebView2 install failed: $($setup.ExitCode)" }
          }
          $exe = (Resolve-Path 'src-tauri/target/release/aurora-launcher.exe').Path
          $process = Start-Process $exe -PassThru
          try {
            for ($attempt=0; $attempt -lt 20; $attempt++) {
              Start-Sleep -Seconds 1
              $process.Refresh()
              if ($process.HasExited) { throw "Launcher exited unexpectedly: $($process.ExitCode)" }
              if ($process.MainWindowTitle -like 'Aurora*') { break }
            }
            if ($process.MainWindowTitle -notlike 'Aurora*') { throw 'Launcher did not create its main window' }
            Write-Host "Startup verified: $($process.MainWindowTitle), PID $($process.Id)"
          } finally {
            taskkill /PID $process.Id /T /F | Out-Null
          }
      - name: Package portable executable and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts
          Copy-Item src-tauri/target/release/aurora-launcher.exe artifacts/Aurora-Launcher-Portable.exe
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe artifacts/
          Get-ChildItem artifacts/*.exe | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: aurora-windows-x64
          path: aurora-launcher/artifacts/*
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create $env:GITHUB_REF_NAME artifacts/* --title "Aurora Launcher $env:GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md --prerelease
