name: Verify Aurora release checksums
on:
  push:
    branches: ['codex/aurora-launcher-20261109']
    paths: ['.github/workflows/aurora-release-checksums.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Aurora release tag'
        required: true
        default: 'aurora-v0.1.3'
permissions:
  contents: write
jobs:
  checksums:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.inputs.tag || 'aurora-v0.1.3' }}
    steps:
      - name: Download and inspect published executables
        run: |
          case "$RELEASE_TAG" in aurora-v*) ;; *) exit 1;; esac
          gh release download "$RELEASE_TAG" --pattern '*.exe' --dir dist
          file dist/*.exe
          test -f dist/Aurora-Launcher-Portable.exe
      - name: Generate hashes using published asset filenames
        working-directory: dist
        run: sha256sum *.exe > SHA256SUMS.txt
      - name: Publish and verify checksums
        run: |
          gh release upload "$RELEASE_TAG" dist/SHA256SUMS.txt --clobber
          gh release download "$RELEASE_TAG" --pattern SHA256SUMS.txt --dir verify
          cd dist
          sha256sum --check ../verify/SHA256SUMS.txt
