name: Build bamber client

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build Minecraft mod
        run: bash gradlew build --no-daemon
      - name: Upload mod artifact
        uses: actions/upload-artifact@v4
        with:
          name: bamber-client-1.21.11
          path: build/libs/bamber-client-1.0.3.jar
      - name: Publish downloadable JAR
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" build/libs/bamber-client-1.0.3.jar --title "bamber client $RELEASE_TAG" --notes-file .github/release-notes.md
